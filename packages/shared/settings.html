<!doctype html>
<html lang="zh-TW">
  <head>
    <!-- 兩個 app 共用（來源：packages/shared/settings.html）；帳號區塊由 settings-core.js 依 APP_CONFIG.auth 動態插入。 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小工具設定</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <h1>小工具設定</h1>
        <p id="statusText">時間設定需按「儲存」；Dock 開關會立即套用</p>
      </header>

      <section class="field">
        <label for="recentFastInput">近期偏快呼吸</label>
        <div class="control-row">
          <input id="recentFastRange" type="range" min="1" max="20" step="0.5" />
          <input id="recentFastInput" type="number" min="1" max="20" step="0.5" />
        </div>
      </section>

      <section class="field">
        <label for="criticalInput">接近耗盡閃爍</label>
        <div class="control-row">
          <input id="criticalRange" type="range" min="1" max="20" step="0.5" />
          <input id="criticalInput" type="number" min="1" max="20" step="0.5" />
        </div>
      </section>

      <section class="field">
        <label for="quotaRefreshInput">額度重新整理間隔</label>
        <div class="control-row">
          <input id="quotaRefreshRange" type="range" min="1" max="30" step="1" />
          <input id="quotaRefreshInput" type="number" min="1" max="30" step="1" />
        </div>
      </section>

      <section class="field toggle-field">
        <div class="toggle-copy">
          <label for="showInDockInput">在 Dock 顯示圖示</label>
          <p>切換後立即儲存；關閉時仍會執行，可再次開啟 App 喚回。</p>
        </div>
        <label class="switch" aria-label="在 Dock 顯示圖示">
          <input id="showInDockInput" type="checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>

      <footer>
        <button id="resetBtn" type="button" class="secondary">恢復預設</button>
        <button id="saveBtn" type="button">儲存</button>
      </footer>
    </main>
    <script src="../app-config.js"></script>
    <script src="./settings-core.js"></script>
  </body>
</html>
